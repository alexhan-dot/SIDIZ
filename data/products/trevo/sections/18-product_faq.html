<section id="shopify-section-template--24699215511842__product_faq_pFJHYe" class="shopify-section section-product-faq section-product-information"><div class="container">
  <div class="wrapper">
    <div class="wrapper--header">
        <style data-shopify>
          .section-product-faq .title { margin: 0; padding: 0; }
        </style>
        
        <h2 class="title">FAQ</h2>
          
    </div>
      <div class="wrapper--body">
        
          <div class="information-list">
            
              <div class="information-item" >
                <div class="item--text">
                  
                  <h3 class="title">시디즈 트레보는 몇 살까지 사용할 수 있나요?</h3>
                    
                  <div class="description rich-text-area"><div class="size-15">트레보의 권장 사용 신장은 100cm~140cm로,  소아청소년 신체 발육 표준 데이터를 바탕으로 만 5세에서 10세에 적합하도록 설계되었습니다.<br/>다만, 아이의 성장 속도에 따라 다를 수 있는 점 참고해주세요.</div></div>
                </div>
              </div>
            
              <div class="information-item" >
                <div class="item--text">
                  
                  <h3 class="title">성인이 앉아도 되나요?</h3>
                    
                  <div class="description rich-text-area"><div class="size-15">시디즈 트레보의 최대 하중은 80kg 입니다.<br/>무게를 고려하여 사용해 주세요.</div></div>
                </div>
              </div>
            
          </div>
        
      </div>
    </div>
  </div>


  <script>
    (function() {
      // 현재 섹션 FAQ 블록 + product-information에서 모은 블록(window.__faqBlocks) 통합
      const ownFaqs = [{
          name: "시디즈 트레보는 몇 살까지 사용할 수 있나요?",
          answer: "트레보의 권장 사용 신장은 100cm~140cm로,  소아청소년 신체 발육 표준 데이터를 바탕으로 만 5세에서 10세에 적합하도록 설계되었습니다.다만, 아이의 성장 속도에 따라 다를 수 있는 점 참고해주세요."
        },
{
          name: "성인이 앉아도 되나요?",
          answer: "시디즈 트레보의 최대 하중은 80kg 입니다.무게를 고려하여 사용해 주세요."
        }
];

      const extraFaqs = Array.isArray(window.__faqBlocks) ? window.__faqBlocks : [];
      const allFaqs = [...ownFaqs, ...extraFaqs].filter(q => q && q.name && q.answer);
      if (allFaqs.length === 0) return;

      const payload = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": allFaqs.map(q => ({
          "@type": "Question",
          "name": q.name,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": q.answer
          }
        }))
      };

      const scriptId = "merged-faq-schema-template--24699215511842__product_faq_pFJHYe";
      const existing = document.getElementById(scriptId);
      if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
      }
      const script = document.createElement('script');
      script.id = scriptId;
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(payload);
      document.head.appendChild(script);
    })();
  </script>



</section>
