<script>
  // JavaScript로 모든 페이지 데이터를 병합
  let allRecommendProductDataLoaded;
  const allRecommendProductData = [];
  async function fetchAllRecommendProductData() {
    let currentPage = document.querySelector('.recommend-products-data');
    let nextPageUrl = currentPage.dataset.nextPage;

    // 현재 페이지 데이터 병합
    const parseData = (element) => {
      const pageData = JSON.parse(element.textContent);
      allRecommendProductData.push(...pageData.products);
    };

    parseData(currentPage);

    // 다음 페이지로 이동하며 데이터 병합
    while (nextPageUrl) {
      const response = await fetch(nextPageUrl);
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const nextPageScript = doc.querySelector('.recommend-products-data');
      nextPageUrl = nextPageScript.dataset.nextPage;

      parseData(nextPageScript);
    }
    return allRecommendProductData;
  }

  allRecommendProductDataLoaded = fetchAllRecommendProductData();
</script>
