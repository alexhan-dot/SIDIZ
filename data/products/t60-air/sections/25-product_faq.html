<section id="shopify-section-template--25383594492194__product_faq_pFJHYe" class="shopify-section section-product-faq section-product-information"><div class="container">
  <div class="wrapper">
    <div class="wrapper--header">
        <style data-shopify>
          .section-product-faq .title { margin: 0; padding: 0; }
        </style>
        
        <h2 class="title">FAQ</h2>
          
    </div>
      <div class="wrapper--body">
        
          <div class="information-list">
            
              <div class="information-item" >
                <div class="item--text">
                  
                  <h3 class="title">등판을 최대로 얼마나 젖힐 수 있고, 젖힌 상태에서도 고정할 수 있나요?</h3>
                    
                  <div class="description rich-text-area"><div class="size-13">T60 AIR의 등판은 5단계 범위 조절을 통해 최소 105°~ 최대 130° 까지 젖힐 수 있습니다.<br/>다만, 등판 젖힘 각도를 조절하더라도 등판이 따라 올라오지 않도록 젖힌 상태로 고정하는<br/>기능은 제공되지 않습니다.</div></div>
                </div>
              </div>
            
          </div>
        
      </div>
    </div>
  </div>


  <script>
    (function() {
      // 현재 섹션 FAQ 블록 + product-information에서 모은 블록(window.__faqBlocks) 통합
      const ownFaqs = [{
          name: "등판을 최대로 얼마나 젖힐 수 있고, 젖힌 상태에서도 고정할 수 있나요?",
          answer: "T60 AIR의 등판은 5단계 범위 조절을 통해 최소 105°~ 최대 130° 까지 젖힐 수 있습니다.다만, 등판 젖힘 각도를 조절하더라도 등판이 따라 올라오지 않도록 젖힌 상태로 고정하는기능은 제공되지 않습니다."
        }
];

      const extraFaqs = Array.isArray(window.__faqBlocks) ? window.__faqBlocks : [];
      const allFaqs = [...ownFaqs, ...extraFaqs].filter(q => q && q.name && q.answer);
      if (allFaqs.length === 0) return;

      const payload = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": allFaqs.map(q => ({
          "@type": "Question",
          "name": q.name,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": q.answer
          }
        }))
      };

      const scriptId = "merged-faq-schema-template--25383594492194__product_faq_pFJHYe";
      const existing = document.getElementById(scriptId);
      if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
      }
      const script = document.createElement('script');
      script.id = scriptId;
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(payload);
      document.head.appendChild(script);
    })();
  </script>



</section>
