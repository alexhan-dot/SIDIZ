<section id="shopify-section-template--24699215937826__product_faq_pFJHYe" class="shopify-section section-product-faq section-product-information"><div class="container">
  <div class="wrapper">
    <div class="wrapper--header">
        <style data-shopify>
          .section-product-faq .title { margin: 0; padding: 0; }
        </style>
        
        <h2 class="title">FAQ</h2>
          
    </div>
      <div class="wrapper--body">
        
          <div class="information-list">
            
              <div class="information-item" >
                <div class="item--text">
                  
                  <h3 class="title">바퀴 사양을 구매했는데, 글라이드 사양으로 바꾸고 싶습니다. 교체 가능한가요?</h3>
                    
                  <div class="description rich-text-area"><div class="size-15">에가는 바퀴와 고정 글라이드로 상호 교체할 수 있습니다.<br/>다만 AS를 통해서 교체가 가능하며, 교체할 경우 제품의 높이가 달라집니다.<br/><br/>또한 4-LEGS형의 경우, 바퀴와 글라이드에 체결된 다리 프레임이 서로 다르므로,<br/>다리 프레임까지 교체해야 합니다. </div></div>
                </div>
              </div>
            
          </div>
        
      </div>
    </div>
  </div>


  <script>
    (function() {
      // 현재 섹션 FAQ 블록 + product-information에서 모은 블록(window.__faqBlocks) 통합
      const ownFaqs = [{
          name: "바퀴 사양을 구매했는데, 글라이드 사양으로 바꾸고 싶습니다. 교체 가능한가요?",
          answer: "에가는 바퀴와 고정 글라이드로 상호 교체할 수 있습니다.다만 AS를 통해서 교체가 가능하며, 교체할 경우 제품의 높이가 달라집니다.또한 4-LEGS형의 경우, 바퀴와 글라이드에 체결된 다리 프레임이 서로 다르므로,다리 프레임까지 교체해야 합니다."
        }
];

      const extraFaqs = Array.isArray(window.__faqBlocks) ? window.__faqBlocks : [];
      const allFaqs = [...ownFaqs, ...extraFaqs].filter(q => q && q.name && q.answer);
      if (allFaqs.length === 0) return;

      const payload = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": allFaqs.map(q => ({
          "@type": "Question",
          "name": q.name,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": q.answer
          }
        }))
      };

      const scriptId = "merged-faq-schema-template--24699215937826__product_faq_pFJHYe";
      const existing = document.getElementById(scriptId);
      if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
      }
      const script = document.createElement('script');
      script.id = scriptId;
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(payload);
      document.head.appendChild(script);
    })();
  </script>



</section>
